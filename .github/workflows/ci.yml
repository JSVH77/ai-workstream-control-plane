name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: shellcheck -S warning init.sh hooks/*.sh scripts/*.sh scripts/wf
      - name: py_compile (warnings are errors)
        run: python3 -W error -m py_compile scripts/*.py hooks/*.py
      - name: decoupling lint (core zone)
        run: cp config/project.example.yaml config/project.yaml && python3 scripts/decoupling-lint.py --zone core
      - name: smoke (blank repo, both layouts)
        run: bash scripts/smoke-fresh-repo.sh
